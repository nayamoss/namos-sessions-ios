name: NamosSessions
options:
  bundleIdPrefix: com.namos
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Config.local.xcconfig
  Release: Config.local.xcconfig
packages:
  ClerkKit:
    url: https://github.com/clerk/clerk-ios
    from: 1.3.1
  ConvexMobile:
    url: https://github.com/get-convex/convex-swift
    from: 0.8.0
  ElevenLabs:
    url: https://github.com/elevenlabs/elevenlabs-swift-sdk
    from: 3.2.2
targets:
  NamosSessions:
    type: application
    platform: iOS
    sources:
      - path: NamosSessions
    info:
      path: NamosSessions/Info.plist
      properties:
        CFBundleDisplayName: Namos Sessions
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: Namos Sessions needs your microphone so you can talk to the agent hands-free.
        NSSpeechRecognitionUsageDescription: Namos Sessions uses speech recognition to turn what you say into agent instructions.
        UIBackgroundModes:
          - remote-notification
        ClerkPublishableKey: $(CLERK_PUBLISHABLE_KEY)
        ConvexBaseURL: $(CONVEX_BASE_URL)
    entitlements:
      path: NamosSessions.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(NAMOS_SESSIONS_IOS_BUNDLE_IDENTIFIER)
        SWIFT_VERSION: 5.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: ""
        # ConvexMobile's official 0.8.x Rust binary ships the arm64 Simulator slice.
        # Excluding Intel Simulator avoids Xcode trying to link a slice the package does not provide.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    dependencies:
      - package: ClerkKit
      - package: ConvexMobile
      - package: ElevenLabs
  # Host-side tap automation (osascript/System Events) needs macOS Accessibility
  # permission that this machine does not grant, which is why "build succeeded" kept
  # standing in for "confirmed working." XCUITest drives the simulator from the inside
  # and needs no such permission, so interactive verification is scriptable here.
  NamosSessionsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NamosSessionsUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(NAMOS_SESSIONS_IOS_BUNDLE_IDENTIFIER).uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.0
        DEVELOPMENT_TEAM: ""
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    dependencies:
      - target: NamosSessions
schemes:
  NamosSessions:
    build:
      targets:
        NamosSessions: all
        NamosSessionsUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NamosSessionsUITests
